<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkyStudee</title>
<!-- Minimal boot screen, not the application UI. src/skystudee.html owns app styling. -->
<style>
html,body{margin:0;min-height:100%;background:#090d13;color:#eef2f7;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#boot{min-height:100dvh;display:grid;place-items:center;text-align:center}
#boot b{font-size:1.05rem;font-weight:650;letter-spacing:-.02em}
#boot span{display:block;color:#64748b;font-size:.78rem;margin-top:.45rem}
</style>
</head>
<body>
<div id="boot"><div><b>SkyStudee</b><span>Loading…</span></div></div>
<!-- Loader template: tools/build.py supplies version and count; do not edit generated index.html. -->
<script>
// Deployment contract: concatenate ALL ordered base64 fragments, then decode
// and decompress once. Individual fragments are not independent gzip files.
// A deployment must publish loader and fragments together, never piecemeal.
// This loader only fetches public static assets; Firebase starts inside the app.

(async()=>{
 try{
  // Version invalidates old cache URLs. It is NOT the local/cloud schema version.
  const version='__BUILD_VERSION__';
  const texts=await Promise.all(Array.from({length:__BUILD_COUNT__},async(_,i)=>{
   const part=String(i+1).padStart(2,'0');
   const r=await fetch(`assets/mobile-build-${part}?v=${version}`,{cache:'no-store'});
   if(!r.ok) throw new Error(`Build part ${i+1}: HTTP ${r.status}`);
   return (await r.text()).trim();
  }));
  // No credentials or private account state are embedded in these static chunks.
  const binary=atob(texts.join(''));
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  // Preserve this document replacement ordering. The decoded classic script
  // binds its DOM and initializes local memory before async Firebase imports.
  document.open();
  document.write(html);
  document.close();
 }catch(error){
  // Download/decode failure must not clear localStorage. A runtime exception
  // inside the injected script is a separate diagnostic (see docs/KNOWN_LIMITS.md).
  console.error(error);
  document.getElementById('boot').innerHTML='<div><b>SkyStudee could not load</b><span>Refresh the page to try again.</span></div>';
 }
})();
</script>
</body>
</html>
