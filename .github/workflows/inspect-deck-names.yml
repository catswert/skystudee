name: Inspect SkyStudee deck names

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-inspect-decks'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode bundle and write deck-name diagnostics
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -o "Array.from({length:[0-9]*}" index.html | grep -o '[0-9]*' | head -1)
          for i in $(seq -w 1 "$count"); do cat "assets/mobile-build-$i"; done | base64 -d | gzip -d > /tmp/skystudee.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/skystudee.html').read_text()
          lines=[]
          for m in re.finditer(r'const\s+([A-Z0-9_]*DECK(?:_NAME|_ID)?)\s*=\s*"([^"]+)"', s):
              lines.append(f'{m.group(1)} = {m.group(2)}')
          # Also capture explicit built-in deck records with nearby names/ids.
          for m in re.finditer(r'\{[^{}]{0,500}?id:\s*"([^"]+)"[^{}]{0,500}?name:\s*"([^"]+)"[^{}]{0,500}?builtin:\s*true[^{}]{0,500}?\}', s, re.S):
              lines.append(f'BUILTIN_RECORD = {m.group(1)} | {m.group(2)}')
          Path('.skystudee-deck-names.txt').write_text('\n'.join(dict.fromkeys(lines))+'\n')
          PY
          rm -f .skystudee-update/run-inspect-decks
          rm -f .github/workflows/inspect-deck-names.yml
          rmdir .skystudee-update 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Inspect current built-in deck names"
          git push
