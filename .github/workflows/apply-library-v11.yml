name: Apply SkyStudee library v11

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-library-v11'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested multi-deck study build
        shell: bash
        run: |
          set -euo pipefail

          count=$(grep -o "Array.from({length:[0-9]*}" index.html | grep -o '[0-9]*' | head -1)
          : "${count:?Could not determine deployed build-part count}"
          for n in $(seq 1 "$count"); do
            i=$(printf '%02d' "$n")
            cat "assets/mobile-build-$i"
          done | base64 -d | gzip -d > /tmp/skystudee-before.html

          cat .skystudee-update/library-v11-patch-01 .skystudee-update/library-v11-patch-02 | base64 -d | gzip -d > /tmp/library-v11.patch
          cp /tmp/skystudee-before.html /tmp/skystudee.html
          set +e
          patch /tmp/skystudee.html < /tmp/library-v11.patch
          patch_status=$?
          set -e

          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/skystudee.html').read_text()

          # The deployed v10 source contains a small startup-fix formatting
          # difference from the locally exported v10 test source. Exactly one
          # tiny hunk may reject: the studySet normalization in mergeAppState.
          rej=Path('/tmp/skystudee.html.rej')
          if rej.exists():
              r=rej.read_text()
              if r.count('@@ -') != 1 or 'target.studySet = normalizeStudySetState(target.studySet, target);' not in r:
                  raise SystemExit('Unexpected patch rejection:\n'+r)
              addition='      target.studySet = normalizeStudySetState(target.studySet, target);'
              if addition not in s:
                  pat=r'(seedPsychologyDeckForUpgrade\\(target, saved\\.version\\);\\s+ensureOrganizationState\\(target\\);)'
                  s,n=re.subn(pat, lambda m: m.group(1)+'\\n'+addition, s, count=1)
                  if n != 1:
                      raise SystemExit('Could not place studySet merge normalization')
                  Path('/tmp/skystudee.html').write_text(s)

          s=Path('/tmp/skystudee.html').read_text()
          checks=[
              ('app version 9', re.search(r'const\s+APP_VERSION\s*=\s*9\s*;',s)),
              ('study set overlay','id="studySetOverlay"' in s),
              ('class/unit/deck picker','renderStudySetPicker' in s and 'setPendingStudyDecks' in s),
              ('owning deck facts','deckForFact(fact)' in s and 'factKey(fact)' in s and 'pairKey(fact)' in s),
              ('combined session persistence','restoreStudySetSession' in s and 'appState.studySet.sessionState' in s),
              ('combined cold test','studySetDeckCount' in s and 'result.deckId' in s),
              ('study set selector','__study_set__' in s),
              ('library home retained','showDecksView();' in s),
              ('arrow-only grading','event.key === "ArrowLeft"' in s and 'event.key === "ArrowRight"' in s),
              ('no x grade alias','event.key === "x"' not in s and 'event.key === "X"' not in s),
          ]
          missing=[name for name,ok in checks if not ok]
          if missing:
              raise SystemExit('Missing v11 features: '+', '.join(missing))
          start=s.index('<script>')+8
          end=s.rindex('</script>')
          Path('/tmp/skystudee.js').write_text(s[start:end])
          print('v11 feature assertions passed')
          PY
          node --check /tmp/skystudee.js

          python - <<'PY'
          from pathlib import Path
          import gzip,base64,re
          src=Path('/tmp/skystudee.html').read_bytes()
          encoded=base64.b64encode(gzip.compress(src,compresslevel=9,mtime=0)).decode()
          parts=[encoded[i:i+9792] for i in range(0,len(encoded),9792)]
          if len(parts) != 9:
              raise SystemExit(f'Expected 9 build parts, got {len(parts)}')
          assets=Path('assets')
          for p in assets.glob('mobile-build-*'):
              p.unlink()
          for i,part in enumerate(parts,1):
              (assets/f'mobile-build-{i:02d}').write_text(part)
          rebuilt=''.join((assets/f'mobile-build-{i:02d}').read_text() for i in range(1,len(parts)+1))
          if gzip.decompress(base64.b64decode(rebuilt)) != src:
              raise SystemExit('Rebuilt bundle did not reconstruct exactly')
          p=Path('index.html')
          loader=p.read_text()
          loader=re.sub(r"const version='[^']+';", "const version='library-v11-20260903';", loader)
          loader=re.sub(r'Array\.from\(\{length:\d+\}', f'Array.from({{length:{len(parts)}}}', loader)
          loader=loader.replace("{cache:'no-cache'}", "{cache:'no-store'}")
          p.write_text(loader)
          print(f'Bundle rebuilt as {len(parts)} parts')
          PY

          rm -f .skystudee-update/run-library-v11
          rm -f .skystudee-update/library-v11-patch-01
          rm -f .skystudee-update/library-v11-patch-02
          rm -f .github/workflows/apply-library-v11.yml
          rmdir .skystudee-update 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add multi-deck study sets"
          git push
