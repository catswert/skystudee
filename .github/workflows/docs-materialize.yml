# One-time documentation preparation on an isolated branch. Never writes main.
# The final commit removes this workflow and its comment-insertion manifests.
name: Materialize and verify documented SkyStudee source
on:
  push:
    branches: [docs/agent-maintenance-guide]
    paths: [.github/workflows/docs-materialize.yml]
permissions:
  contents: write
jobs:
  document:
    if: github.ref == 'refs/heads/docs/agent-maintenance-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/agent-maintenance-guide
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Recover baseline and insert verified documentation comments
        run: |
          set -euo pipefail
          python tools/recover_source.py --output /tmp/skystudee-original.html
          echo 'a1178e5f24b050e1ae507a0d9daf20c028077d33a16314446880db8ea58c29b7  /tmp/skystudee-original.html' | sha256sum --check --strict
          python .maintenance/annotate.py /tmp/skystudee-original.html src/skystudee.html
          echo '2400fe987319ede7fbace2af14399d33ebf93b1fc0e7750f421fcf77bcbe58f9  src/skystudee.html' | sha256sum --check --strict
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify executable source and DOM shape are unchanged
        run: |
          node tests/source_contracts.cjs --baseline /tmp/skystudee-original.html
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tests')
          from test_build import MarkupShape
          old=MarkupShape(); new=MarkupShape()
          old.feed(Path('/tmp/skystudee-original.html').read_text())
          new.feed(Path('src/skystudee.html').read_text())
          assert old.tokens == new.tokens, 'Non-comment HTML shape changed'
          print('PASS HTML shape',len(old.tokens),'tokens')
          PY
      - name: Build complete static artifact and check integrity
        run: |
          python tools/build.py --version docs-v14-20260907
          python tools/build.py --check
          python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test actual app with synthetic state and mocked Firebase
        run: python tests/browser_smoke.py --baseline /tmp/skystudee-original.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-validation-results
          path: test-results/
          retention-days: 7
      - name: Commit only the verified source, documentation and generated build
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = refs/heads/docs/agent-maintenance-guide
          git rm -r .maintenance
          git rm .github/workflows/docs-source-snapshot.yml .github/workflows/docs-materialize.yml
          git add AGENTS.md README.md .gitignore docs src tools tests package.json package-lock.json .github/workflows/validate.yml index.html assets build-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document application, Firebase bootstrap, and agent maintenance'
          git push origin HEAD:docs/agent-maintenance-guide
