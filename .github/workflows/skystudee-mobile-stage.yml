name: Apply staged SkyStudee mobile build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skystudee-mobile-stage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify tested mobile build
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .skystudee-update -maxdepth 1 -type f -name 'mobile-*' | wc -l)
          if [ "$count" -ne 6 ]; then
            echo "Expected all 6 staged parts, found $count."
            exit 1
          fi
          cat .skystudee-update/mobile-01 \
              .skystudee-update/mobile-02 \
              .skystudee-update/mobile-03 \
              .skystudee-update/mobile-04 \
              .skystudee-update/mobile-05 \
              .skystudee-update/mobile-06 \
            | base64 -d | gzip -d > index.html
          actual=$(git hash-object index.html)
          expected=b2092ea7f9c053576c9ae6877027746fecab83d2
          if [ "$actual" != "$expected" ]; then
            echo "Hash mismatch: expected $expected, got $actual"
            exit 1
          fi
          start=$(grep -n -m1 '<script>' index.html | cut -d: -f1)
          end=$(grep -n '</script>' index.html | tail -1 | cut -d: -f1)
          sed -n "$((start+1)),$((end-1))p" index.html > /tmp/skystudee.js
          node --check /tmp/skystudee.js
      - name: Commit tested mobile build
        shell: bash
        run: |
          rm -rf .skystudee-update
          git config user.name "SkyStudee Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .skystudee-update
          git commit -m "Add mobile-specific SkyStudee UI"
          git push
