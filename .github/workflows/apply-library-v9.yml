name: Apply SkyStudee library v9

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-library-v9'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply legacy startup fix
        shell: bash
        run: |
          set -euo pipefail

          count=$(grep -o "Array.from({length:[0-9]*}" index.html | grep -o '[0-9]*' | head -1)
          : "${count:?Could not determine deployed build-part count}"
          for n in $(seq 1 "$count"); do
            i=$(printf '%02d' "$n")
            cat "assets/mobile-build-$i"
          done | base64 -d | gzip -d > /tmp/skystudee-before.html

          base64 -d .skystudee-update/library-v9.patch.gz.b64 | gzip -d > /tmp/library-v9.patch
          cp /tmp/skystudee-before.html /tmp/skystudee.html
          patch /tmp/skystudee.html < /tmp/library-v9.patch

          python - <<'PY'
          from pathlib import Path
          import re,hashlib
          s=Path('/tmp/skystudee.html').read_text()
          checks=[
            ('no early persist in brain rename', 'appState.decks[BRAIN_DECK_ID].name = BRAIN_DECK_NAME;\n      persistState();' not in s),
            ('library home startup', 'showDecksView();\n\n    showOnboardingIfNeeded();' in s),
            ('app version 8 retained', re.search(r'const\s+APP_VERSION\s*=\s*8\s*;',s)),
          ]
          missing=[name for name,ok in checks if not ok]
          if missing: raise SystemExit('Missing v9 fixes: '+', '.join(missing))
          start=s.index('<script>')+8
          end=s.rindex('</script>')
          Path('/tmp/skystudee.js').write_text(s[start:end])
          expected='8e6490454f41efc7b412ac79f08418cc6d438957f26cb932ed13ffa1ae272182'
          actual=hashlib.sha256(Path('/tmp/skystudee.html').read_bytes()).hexdigest()
          if actual != expected: raise SystemExit(f'Tested-source SHA mismatch: {actual}')
          PY
          node --check /tmp/skystudee.js

          python - <<'PY'
          from pathlib import Path
          import gzip,base64,re
          src=Path('/tmp/skystudee.html').read_bytes()
          encoded=base64.b64encode(gzip.compress(src,compresslevel=9,mtime=0)).decode()
          parts=[encoded[i:i+9792] for i in range(0,len(encoded),9792)]
          if len(parts) != 9:
              raise SystemExit(f'Expected 9 build parts, got {len(parts)}')
          assets=Path('assets')
          for p in assets.glob('mobile-build-*'):
              p.unlink()
          for i,part in enumerate(parts,1):
              (assets/f'mobile-build-{i:02d}').write_text(part)
          rebuilt=''.join((assets/f'mobile-build-{i:02d}').read_text() for i in range(1,len(parts)+1))
          if gzip.decompress(base64.b64decode(rebuilt)) != src:
              raise SystemExit('Bundle reconstruction mismatch')
          p=Path('index.html')
          loader=p.read_text()
          loader=re.sub(r"const version='[^']+';", "const version='library-v9-20260902';", loader)
          loader=re.sub(r'Array\.from\(\{length:\d+\}', f'Array.from({{length:{len(parts)}}}', loader)
          loader=loader.replace("{cache:'no-cache'}", "{cache:'no-store'}")
          p.write_text(loader)
          PY

          rm -f .skystudee-update/run-library-v9
          rm -f .skystudee-update/library-v9.patch.gz.b64
          rm -f .github/workflows/apply-library-v9.yml
          rmdir .skystudee-update 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix legacy startup and open Library first"
          git push
