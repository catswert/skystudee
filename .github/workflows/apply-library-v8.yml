name: Apply SkyStudee library v8

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-library-v8'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested organization completion build
        shell: bash
        run: |
          set -euo pipefail

          count=$(grep -o "Array.from({length:[0-9]*}" index.html | grep -o '[0-9]*' | head -1)
          : "${count:?Could not determine deployed build-part count}"
          for n in $(seq 1 "$count"); do
            i=$(printf '%02d' "$n")
            cat "assets/mobile-build-$i"
          done | base64 -d | gzip -d > /tmp/skystudee-before.html

          cat .skystudee-update/library-v8-patch-01 .skystudee-update/library-v8-patch-02 \
            | base64 -d | gzip -d > /tmp/library-v8.patch
          cp /tmp/skystudee-before.html /tmp/skystudee.html
          patch /tmp/skystudee.html < /tmp/library-v8.patch

          python - <<'PY'
          from pathlib import Path
          import hashlib, re
          s=Path('/tmp/skystudee.html').read_text()
          raw=s.encode()
          expected='b92367d472eb5910fa2e349d808afeaec7ccb396e71c95de21266590fa06b14c'
          actual=hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Tested-source SHA mismatch: {actual}')

          checks = [
              ('APP_VERSION 8', re.search(r'const\s+APP_VERSION\s*=\s*8\s*;', s)),
              ('subject families', 'SUBJECT_FAMILIES' in s),
              ('class catalog', 'CLASS_CATALOG' in s),
              ('edit class', 'editClass' in s),
              ('merge class', 'mergeClass' in s),
              ('edit unit', 'editUnit' in s),
              ('merge unit', 'mergeUnit' in s),
              ('delete class', 'deleteClass' in s),
              ('delete unit', 'deleteUnit' in s),
              ('deck reorder', 'reorderDeck' in s),
              ('unsorted class', 'UNSORTED_CLASS_ID' in s),
              ('migration guard', 'seedBundled = false' in s),
              ('family filter', 'subjectFamilyFilter' in s),
              ('mandatory import unit', 'importUnitInput' in s),
              ('Unit 0 deck', 'AP Psychology Unit 0 — Research Methods' in s),
              ('Unit 1 brain deck', 'Biological Bases of Behavior: The Brain' in s),
          ]
          missing=[name for name,ok in checks if not ok]
          if missing:
              raise SystemExit('Missing expected v8 features: '+', '.join(missing))

          catalog_match=re.search(r'const\s+CLASS_CATALOG\s*=\s*\[(.*?)\];', s, re.S)
          if not catalog_match:
              raise SystemExit('Could not locate CLASS_CATALOG')
          ap_count=len(re.findall(r'["\']id["\']\s*:\s*["\']ap_', catalog_match.group(1)))
          if ap_count != 42:
              raise SystemExit(f'Expected 42 AP catalog classes, found {ap_count}')

          start=s.index('<script>')+8
          end=s.rindex('</script>')
          Path('/tmp/skystudee.js').write_text(s[start:end])
          print('All v8 content assertions and SHA verification passed.')
          PY
          node --check /tmp/skystudee.js

          python - <<'PY'
          from pathlib import Path
          import gzip,base64,re
          src=Path('/tmp/skystudee.html').read_bytes()
          encoded=base64.b64encode(gzip.compress(src,compresslevel=9,mtime=0)).decode()
          parts=[encoded[i:i+9792] for i in range(0,len(encoded),9792)]
          if len(parts) != 9:
              raise SystemExit(f'Expected 9 build parts, got {len(parts)}')

          assets=Path('assets')
          for p in assets.glob('mobile-build-*'):
              p.unlink()
          for i,part in enumerate(parts,1):
              (assets/f'mobile-build-{i:02d}').write_text(part)

          rebuilt=''.join((assets/f'mobile-build-{i:02d}').read_text() for i in range(1,len(parts)+1))
          decoded=gzip.decompress(base64.b64decode(rebuilt))
          if decoded != src:
              raise SystemExit('Rebuilt bundle did not reconstruct exactly')

          p=Path('index.html')
          loader=p.read_text()
          loader=re.sub(r"const version='[^']+';", "const version='library-v8-20260902';", loader)
          loader=re.sub(r'Array\.from\(\{length:\d+\}', f'Array.from({{length:{len(parts)}}}', loader)
          p.write_text(loader)
          print('Bundle rebuilt as 9 parts; exact reconstruction verified.')
          PY

          rm -f .skystudee-update/run-library-v8
          rm -f .skystudee-update/library-v8-patch-01
          rm -f .skystudee-update/library-v8-patch-02
          rm -f .github/workflows/apply-library-v8.yml
          rmdir .skystudee-update 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete class and unit management"
          git push
