name: Export SkyStudee source

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/export-source'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode deployed source
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -o "Array.from({length:[0-9]*}" index.html | grep -o '[0-9]*' | head -1)
          for n in $(seq 1 "$count"); do
            i=$(printf '%02d' "$n")
            cat "assets/mobile-build-$i"
          done | base64 -d | gzip -d > skystudee-source.html
          cp index.html loader-index.html
      - uses: actions/upload-artifact@v4
        with:
          name: skystudee-source
          path: |
            skystudee-source.html
            loader-index.html
            decks/
          if-no-files-found: error
