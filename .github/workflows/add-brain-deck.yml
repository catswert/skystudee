name: Add Biological Bases brain deck

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-brain-deck'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild SkyStudee with brain deck
        shell: bash
        run: |
          set -euo pipefail

          cat $(find assets -maxdepth 1 -type f -name 'mobile-build-*' | sort) \
            | base64 -d | gzip -d > /tmp/skystudee.html

          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('/tmp/skystudee.html')
          s = p.read_text()
          deck = json.loads(Path('decks/biological-bases-brain.studydeck.json').read_text())

          if 'ap_psych:biological_bases_brain' in s:
              raise SystemExit('Brain deck already present in app source')

          cards_js = json.dumps(deck['cards'], ensure_ascii=False, separators=(',', ':'))
          block = f'''

    // ==========================================================
    // PRELOADED BIOLOGICAL BASES — THE BRAIN DECK
    // ==========================================================
    // Seeded once per browser profile. It is user-removable: once the seed
    // flag exists, deleting the deck will not cause it to reappear.
    const BRAIN_DECK_ID = {json.dumps(deck['deckId'])};
    const BRAIN_DECK_NAME = {json.dumps(deck['name'])};
    const BRAIN_CARDS = {cards_js};
    const BRAIN_DECK_SEED_KEY = "skystudee_seed_biological_bases_brain_v1";

    function seedBrainDeckOnce(target) {{
      if (!target || !target.decks) return false;

      let alreadySeeded = false;
      try {{
        alreadySeeded = localStorage.getItem(BRAIN_DECK_SEED_KEY) === "1";
      }} catch (error) {{}}

      if (alreadySeeded) return false;

      if (!target.decks[BRAIN_DECK_ID]) {{
        const deck = createDeckRecord({{
          id: BRAIN_DECK_ID,
          name: BRAIN_DECK_NAME,
          cards: BRAIN_CARDS,
          builtin: false
        }});
        deck.settings.mode = "memory";
        target.decks[BRAIN_DECK_ID] = deck;
      }}

      try {{
        localStorage.setItem(BRAIN_DECK_SEED_KEY, "1");
        localStorage.setItem(STORAGE_KEY, JSON.stringify(target));
      }} catch (error) {{}}

      return true;
    }}
'''

          marker = re.search(r'\n\s*const APP_VERSION\s*=\s*\d+\s*;', s)
          if not marker:
              raise SystemExit('Could not find APP_VERSION insertion marker')
          s = s[:marker.start()] + block + s[marker.start():]

          old = '    let appState = loadAppState();'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one appState initializer, found {s.count(old)}')
          s = s.replace(old, old + '\n    seedBrainDeckOnce(appState);', 1)

          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/skystudee.html').read_text()
          start=s.index('<script>')+8
          end=s.rindex('</script>')
          Path('/tmp/skystudee.js').write_text(s[start:end])
          PY
          node --check /tmp/skystudee.js

          python - <<'PY'
          from pathlib import Path
          import gzip, base64, re

          html=Path('/tmp/skystudee.html').read_bytes()
          encoded=base64.b64encode(gzip.compress(html, compresslevel=9, mtime=0)).decode()
          parts=[encoded[i:i+9792] for i in range(0,len(encoded),9792)]

          assets=Path('assets')
          for old in assets.glob('mobile-build-*'):
              old.unlink()
          for i,part in enumerate(parts,1):
              (assets/f'mobile-build-{i:02d}').write_text(part)

          p=Path('index.html')
          loader=p.read_text()
          loader=re.sub(r"const version='[^']+';", "const version='brain-deck-20260901';", loader)
          loader=re.sub(r'Array\.from\(\{length:\d+\}', f'Array.from({{length:{len(parts)}}}', loader)
          p.write_text(loader)
          print(f'Wrote {len(parts)} build parts')
          PY

          rm -rf .skystudee-update
          rm -f .github/workflows/add-brain-deck.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Biological Bases brain study deck"
          git push
