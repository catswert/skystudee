name: Add Biological Bases brain deck

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-brain-deck'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild SkyStudee with brain deck
        shell: bash
        run: |
          set -euo pipefail
          cat $(find assets -maxdepth 1 -type f -name 'mobile-build-*' | sort) | base64 -d | gzip -d > /tmp/skystudee.html
          python .skystudee-update/add_brain_deck.py
          rm -rf .skystudee-update
          rm -f .github/workflows/add-brain-deck.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Biological Bases brain study deck"
          git push
