name: Apply SkyStudee library v7

on:
  push:
    branches: [main]
    paths:
      - '.skystudee-update/run-library-v7'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested library upgrade
        shell: bash
        run: |
          set -euo pipefail

          count=$(grep -o "Array.from({length:[0-9]*}" index.html | grep -o '[0-9]*' | head -1)
          : "${count:?Could not determine deployed build-part count}"
          for n in $(seq 1 "$count"); do
            i=$(printf '%02d' "$n")
            cat "assets/mobile-build-$i"
          done | base64 -d | gzip -d > /tmp/skystudee-before.html

          base64 -d .skystudee-update/library-v7.patch.gz.b64 | gzip -d > /tmp/library-v7.patch
          cp /tmp/skystudee-before.html /tmp/skystudee.html
          patch /tmp/skystudee.html < /tmp/library-v7.patch

          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/skystudee.html').read_text()
          checks = [
              ('APP_VERSION 7', re.search(r'const\s+APP_VERSION\s*=\s*7\s*;', s)),
              ('class catalog', 'CLASS_CATALOG' in s),
              ('subject families', 'SUBJECT_FAMILIES' in s),
              ('needs unit UI', 'Needs unit' in s),
              ('family filter', 'subjectFamilyFilter' in s),
              ('class filter', 'classFilter' in s),
              ('organization state', 'ensureOrganizationState' in s),
              ('Unit 0 migration', 'Unit 0' in s and 'AP Psychology Unit 0 — Research Methods' in s),
              ('Unit 1 brain deck', 'Unit 1 — AP Psychology — Biological Bases of Behavior: The Brain' in s or 'Unit 1 \\u2014 AP Psychology \\u2014 Biological Bases of Behavior: The Brain' in s),
          ]
          missing=[name for name,ok in checks if not ok]
          if missing:
              raise SystemExit('Missing expected v7 features: '+', '.join(missing))

          catalog_match=re.search(r'const\s+CLASS_CATALOG\s*=\s*\[(.*?)\];', s, re.S)
          if not catalog_match:
              raise SystemExit('Could not locate CLASS_CATALOG')
          ap_count=len(re.findall(r'\bid\s*:\s*["\']ap_', catalog_match.group(1)))
          if ap_count != 42:
              raise SystemExit(f'Expected 42 AP catalog classes, found {ap_count}')

          if 'organizationUnitInput' not in s:
              raise SystemExit('Import unit control missing')

          start=s.index('<script>')+8
          end=s.rindex('</script>')
          Path('/tmp/skystudee.js').write_text(s[start:end])
          print('All library-v7 content assertions passed.')
          PY
          node --check /tmp/skystudee.js

          python - <<'PY'
          from pathlib import Path
          import gzip,base64,re,hashlib
          src=Path('/tmp/skystudee.html').read_bytes()
          expected='525cdbf28b31058da0cf9a901cba8a5feb24b50e3f0a4fed68c101a11eedcfac'
          actual=hashlib.sha256(src).hexdigest()
          if actual != expected:
              raise SystemExit(f'Tested-source SHA mismatch: {actual}')

          encoded=base64.b64encode(gzip.compress(src,compresslevel=9,mtime=0)).decode()
          parts=[encoded[i:i+9792] for i in range(0,len(encoded),9792)]
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 build parts, got {len(parts)}')

          assets=Path('assets')
          for p in assets.glob('mobile-build-*'):
              p.unlink()
          for i,part in enumerate(parts,1):
              (assets/f'mobile-build-{i:02d}').write_text(part)

          rebuilt=''.join((assets/f'mobile-build-{i:02d}').read_text() for i in range(1,len(parts)+1))
          decoded=gzip.decompress(base64.b64decode(rebuilt))
          if decoded != src:
              raise SystemExit('Rebuilt bundle did not reconstruct exactly')

          p=Path('index.html')
          loader=p.read_text()
          loader=re.sub(r"const version='[^']+';", "const version='library-v7-20260902';", loader)
          loader=re.sub(r'Array\.from\(\{length:\d+\}', f'Array.from({{length:{len(parts)}}}', loader)
          p.write_text(loader)
          print('Bundle rebuilt as 8 parts; exact reconstruction verified.')
          PY

          rm -f .skystudee-update/run-library-v7
          rm -f .skystudee-update/library-v7.patch.gz.b64
          rm -f .skystudee-update/export-source
          rm -f .github/workflows/apply-library-v7.yml
          rm -f .github/workflows/export-source.yml
          rmdir .skystudee-update 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add class, unit, and subject organization"
          git push
