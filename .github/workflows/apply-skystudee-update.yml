name: Apply tested SkyStudee update

on:
  push:
    paths:
      - '.github/workflows/apply-skystudee-update.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct tested mobile index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, subprocess

          parts = [Path(f'.skystudee-update/mobile-{i:02}') for i in range(1, 7)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing staged parts: ' + repr(missing))

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          data = gzip.decompress(base64.b64decode(encoded))
          Path('index.html').write_bytes(data)
          actual = subprocess.check_output(['git', 'hash-object', 'index.html'], text=True).strip()
          expected = 'b2092ea7f9c053576c9ae6877027746fecab83d2'
          if actual != expected:
              raise SystemExit(f'Git blob mismatch: expected {expected}, got {actual}')
          print(f'Reconstructed verified index.html ({len(data)} bytes).')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="mobileOptionsBtn"',
              'function enforceMobileCardFit(element)',
              '@media (max-width: 960px) and (max-device-width: 960px)',
              'viewport-fit=cover'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('Missing mobile markers: ' + repr(missing))
          start = source.index('<script>') + len('<script>')
          end = source.rindex('</script>')
          Path('/tmp/skystudee.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/skystudee.js

      - name: Commit tested build
        shell: bash
        run: |
          rm -rf .skystudee-update
          git config user.name "SkyStudee Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .skystudee-update
          git commit -m "Add mobile-specific SkyStudee UI"
          git push
