name: Apply Unit 2 Part 1 cognition deck

on:
  push:
    branches:
      - feature/unit2-part1-cognition-deck
    paths:
      - tools/.run-unit2-part1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/unit2-part1-cognition-deck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Unit 2 Part 1 patch
        run: python tools/.apply-unit2-part1.py
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild generated deployment
        run: python tools/build.py --version unit2-part1-cognition-v18-20260930
      - name: Validate source and build
        run: |
          python tools/build.py --check
          npm run check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Browser smoke
        run: python tests/browser_smoke.py
      - name: Commit validated release
        run: |
          rm -f tools/.apply-unit2-part1.py tools/.run-unit2-part1 .github/workflows/apply-unit2-part1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AP Psychology Unit 2 Part 1 cognition deck"
          git push origin HEAD:feature/unit2-part1-cognition-deck
